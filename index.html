<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Daybook</title>
<meta name="description" content="Idris's shared to-do app — team, projects, and personal tasks, synced everywhere.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5A2D12">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daybook">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="pixels.js"></script>
<style>
:root{
  --bg:#F3EDEA; --bg-2:#F6E3D6; --surface:#FFFFFF; --soft:#F7F2EF; --ink:#1F1A17; --ink-2:#7B716B; --ink-3:#B0A6A0;
  --line:#EAE1DC; --orange:#EF7B2D; --brown:#5A2D12; --peach:#F9D8BF; --peach-ink:#5A2D12; --danger:#E0473A;
  --rem:#D2304F; --rem-soft:#FDE9ED; --rem-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(60,30,10,.04),0 8px 24px rgba(60,30,10,.06);
  --f:"Urbanist",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#15110E; --bg-2:#241710; --surface:#211B17; --soft:#2A231E; --ink:#F6EFEA; --ink-2:#B3A69D; --ink-3:#6F645D;
    --line:#342B25; --orange:#F48A40; --brown:#F48A40; --peach:#3B2517; --peach-ink:#FFD9BD; --danger:#FF6B5E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#15110E; --bg-2:#241710; --surface:#211B17; --soft:#2A231E; --ink:#F6EFEA; --ink-2:#B3A69D; --ink-3:#6F645D;
  --line:#342B25; --orange:#F48A40; --brown:#F48A40; --peach:#3B2517; --peach-ink:#FFD9BD; --danger:#FF6B5E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
html{min-height:100%;overflow-x:hidden;overscroll-behavior-x:none;touch-action:manipulation;background-color:var(--bg-2);background-image:linear-gradient(180deg,var(--bg) 55%,var(--bg-2));background-attachment:fixed}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#33190A;z-index:60;pointer-events:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body::before{background:var(--bg)}}
:root[data-theme="dark"] body::before{background:var(--bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--rem:#FF7A93;--rem-soft:#34171E;--rem-ink:#2A0C13}}
:root[data-theme="dark"]{--rem:#FF7A93;--rem-soft:#34171E;--rem-ink:#2A0C13}
body{min-height:100%;max-width:100%;overflow-x:hidden;touch-action:manipulation;background:transparent;color:var(--ink);font:500 16px/1.4 var(--f);-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:12px}
.app{max-width:640px;margin:0 auto;padding-inline:20px;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
#warn:empty,#updbar:empty{display:none}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:clamp(24px,6.6vw,34px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.top .sub{color:var(--ink-2);font-size:16px;font-weight:500;margin-top:6px}
.me{flex:none;width:50px;height:50px;border-radius:50%;background:var(--peach);color:var(--peach-ink);font-size:22px;font-weight:800;display:grid;place-items:center;position:relative}
.me .badge{position:absolute;right:-2px;top:-2px;width:22px;height:22px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--shadow)}
.me .badge svg{width:13px;height:13px}
.hbtns{display:flex;gap:8px;flex:none}
.hb{width:50px;height:50px;border-radius:50%;background:var(--surface);color:var(--ink-2);display:grid;place-items:center;box-shadow:var(--shadow)}
.hb svg{width:22px;height:22px}
.setgroup{background:var(--surface);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.setrow{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px;border-top:1px solid var(--line);text-align:left;width:100%;box-sizing:border-box}
.setrow:first-child{border-top:0}
button.setrow:hover{background:var(--soft)}
.setrow .av{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--c);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.setrow .av svg{width:17px;height:17px}
.setrow .nm{flex:1;min-width:0;font-weight:700;font-size:16px}
.setrow .meta{color:var(--ink-3);font-size:14px;font-weight:600}
.setrow.addrow{color:var(--orange);font-weight:800}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme{border-radius:18px;background:var(--surface);padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;border:3px solid transparent}
.theme[aria-pressed="true"]{border-color:var(--orange)}
.theme .pv{width:100%;height:58px;border-radius:12px;display:flex;flex-direction:column;gap:5px;padding:9px;box-sizing:border-box}
.theme .pv i{display:block;height:9px;border-radius:5px}
.pv.light{background:#F3EDEA}.pv.light i{background:#fff}.pv.light i:first-child{background:#F9D8BF;width:70%}
.pv.dark{background:#15110E}.pv.dark i{background:#211B17}.pv.dark i:first-child{background:#3B2517;width:70%}
.pv.auto{background:linear-gradient(135deg,#F3EDEA 50%,#15110E 50%)}.pv.auto i{background:rgba(127,127,127,.35)}.pv.auto i:first-child{background:#EF7B2D;width:70%}
.setnote{font-size:13px;color:var(--ink-3);padding:0 4px}
.numdot{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;font-weight:800;font-size:12px;flex:none}
:root[data-theme="dark"] .numdot{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .numdot{color:#1a120c}}
.sum.pri[aria-expanded="true"]{background:var(--orange);color:#fff}
:root[data-theme="dark"] .sum.pri[aria-expanded="true"]{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sum.pri[aria-expanded="true"]{color:#1a120c}}
.numgrid{display:flex;flex-wrap:wrap;gap:8px}
.opt.num{width:46px;height:46px;padding:0;border-radius:50%;justify-content:center;font-weight:800;font-size:17px}
.opt.num[aria-pressed="true"]{background:var(--orange);color:#fff}
:root[data-theme="dark"] .opt.num[aria-pressed="true"]{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt.num[aria-pressed="true"]{color:#1a120c}}

.grouphead{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:2px 4px 0}
.grouphead.done{color:var(--ink-3)}

/* week strip */
.week{display:flex;flex-direction:column;gap:10px}
.weekbar{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ink-2);font-size:14px}
.weekbar .arr{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.weekbar .arr:hover{background:var(--surface)}
.weekbar .arr svg{width:16px;height:16px}
.weekbar .jump{margin-left:auto;font-size:13px;font-weight:800;color:var(--orange);padding:6px 10px;border-radius:999px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:8px}
.day .dn{font-size:15px;color:var(--ink-2);font-weight:500}
.day .dc{width:100%;max-width:52px;aspect-ratio:1;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:18px;font-weight:600;position:relative;transition:transform .15s}
.day .dot{position:absolute;bottom:7px;width:5px;height:5px;border-radius:50%;background:var(--orange)}
.day .dot.red{background:var(--danger)}
.day.today .dn{color:var(--ink);font-weight:800}
.day.today .dc{box-shadow:inset 0 0 0 2px var(--ink)}
.day[aria-pressed="true"] .dc{background:var(--ink);color:var(--bg);box-shadow:none}
.day[aria-pressed="true"] .dot{background:var(--bg)}
.day:active .dc{transform:scale(.94)}

/* banner */
.banner{background:var(--peach);border-radius:26px;padding:22px 20px 22px 22px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.banner .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.banner h2{margin:0;font-size:22px;font-weight:800;color:var(--peach-ink);letter-spacing:-.01em}
.banner p{margin:0;color:var(--peach-ink);opacity:.8;font-size:15px;line-height:1.35}
.banner .cta{align-self:flex-start;margin-top:8px;height:44px;padding:0 20px;border-radius:999px;background:var(--brown);color:#fff;font-weight:700;font-size:15px}
:root[data-theme="dark"] .banner .cta{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner .cta{color:#1a120c}}
.banner .art{flex:none;width:104px;height:104px}
.bar{height:8px;border-radius:9px;background:rgba(90,45,18,.14);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--orange);border-radius:9px;transition:width .4s}

/* filter chips */
.chipgroups{display:flex;flex-direction:column;gap:8px}
.chiplabel{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;padding:0 16px 0 6px;border-radius:999px;background:var(--surface);display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}
.chip.plain{padding-left:16px}
.chip .av{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--c);display:grid;place-items:center;font-size:12px;font-weight:800}
.chip .av svg{width:15px;height:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .av{background:var(--c);color:#fff}
.chip.add{width:42px;padding:0;justify-content:center;border:2px dashed var(--line);background:transparent;color:var(--ink-2);font-size:22px}

/* list */
.head{display:flex;align-items:center;gap:10px}
.head h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.head .edit{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.head .edit svg{width:16px;height:16px}
.head .link{margin-left:auto;font-size:15px;font-weight:600;color:var(--ink);padding:6px 4px}
.sublabel{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 -4px 40px}
.sublabel.red{color:var(--danger)}
.list{display:flex;flex-direction:column;gap:12px;position:relative}
.list::before{content:"";position:absolute;left:11px;top:30px;bottom:30px;border-left:2px dotted var(--line)}
.item{display:flex;align-items:center;gap:14px;position:relative}
.tick{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-3);background:var(--bg);display:grid;place-items:center;color:#fff;position:relative;z-index:1}
.tick::after{content:"";position:absolute;inset:-12px}
.tick svg{width:13px;height:13px;opacity:0}
.tick:hover{border-color:var(--orange)}
.item.done .tick,.item.completing .tick{background:var(--orange);border-color:var(--orange)}
.item.done .tick svg,.item.completing .tick svg{opacity:1}
.card{position:relative;flex:1;min-width:0;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);display:flex;align-items:center;min-height:76px;transition:opacity .35s,transform .35s}
.card .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 8px 12px 4px;text-align:left}
.tile{flex:none;width:42px;height:42px;margin:0 0 0 12px;border-radius:14px;background:color-mix(in srgb,var(--c) 20%,var(--surface));color:var(--c);display:grid;place-items:center;font-weight:800;font-size:16px;transition:background .15s}
button.tile:active{background:color-mix(in srgb,var(--c) 34%,var(--surface))}
.tile.pri{font-size:19px}
.tile svg{width:22px;height:22px}
.tile small{font-size:10px;font-weight:800;margin-left:1px}
.tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.tt{font-size:17px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.ts{font-size:14px;color:var(--ink-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts .red{color:var(--danger);font-weight:700}
.ta{font-size:13px;color:var(--ink-2);opacity:.8;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{flex:none;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:64px;border-left:1.5px solid var(--line);margin-block:14px;color:var(--ink-2);font-size:13px;font-weight:600;border-radius:0 22px 22px 0}
button.side:hover{color:var(--orange)}
.side .ic{width:22px;height:22px;border-radius:50%;background:var(--ink-2);color:var(--surface);display:grid;place-items:center}
button.side:hover .ic{background:var(--orange)}
.side .ic svg{width:13px;height:13px}
.item.done .tt,.item.completing .tt{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-3)}
.item.done .card{box-shadow:none;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.item.done .tile{filter:grayscale(.6);opacity:.7}
.item.completing .card{opacity:.5;transform:translateX(6px)}
.empty{background:var(--surface);border-radius:22px;padding:24px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:4px}
.more{align-self:center;font-weight:700;color:var(--ink-2);padding:10px 18px;border-radius:999px;background:var(--surface)}
.histday{font-size:18px;font-weight:800;margin-top:6px}
.histday span{font-size:14px;font-weight:600;color:var(--ink-3);margin-left:6px}

/* overview */
.ovgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ovtile{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.ovtile .num{font-size:30px;font-weight:800;letter-spacing:-.02em}
.ovtile .lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.ovsec{background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.ovsec h4{margin:0;font-size:15px;font-weight:800}
.ovrow{display:flex;align-items:center;gap:10px}
.ovrow .av{flex:none;width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--c);display:grid;place-items:center;font-size:12px;font-weight:800}
.ovrow .av svg{width:15px;height:15px}
.ovrow .nm{flex:none;width:74px;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovbar{flex:1;height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.ovbar > i{display:block;height:100%;border-radius:999px;background:var(--c)}
.ovrow .n{flex:none;width:24px;text-align:right;font-size:13px;font-weight:800;color:var(--ink-2)}
.ovtrend{display:flex;align-items:flex-end;gap:8px;height:112px}
.ovtrend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.ovtrend .colbar{width:100%;max-width:28px;border-radius:8px 8px 3px 3px;background:var(--orange)}
.ovtrend .v{font-size:12px;font-weight:800;color:var(--ink-2)}
.ovtrend .d{font-size:11px;font-weight:700;color:var(--ink-3)}
.back{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ink-2);height:40px;padding-right:12px}
.back svg{width:18px;height:18px}

/* quick add */
.qa{background:var(--peach);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:10px}
.qa form{display:flex;gap:10px}
.qa input{flex:1;min-width:0;height:58px;border-radius:20px;border:2px solid transparent;background:var(--surface);padding:0 18px;font-size:18px;font-weight:600;outline:none}
.qa input::placeholder{color:var(--ink-3)}
.qa input:focus{border-color:var(--orange)}
.qa .go{flex:none;width:58px;height:58px;border-radius:50%;background:var(--brown);color:#fff;display:grid;place-items:center}
.qa .go svg{width:26px;height:26px}
:root[data-theme="dark"] .qa .go{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qa .go{color:#1a120c}}
.qrow{display:flex;align-items:flex-start;gap:8px}
.qwrap{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px}
.qlabel{flex:none;width:58px;padding-top:13px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--peach-ink);opacity:.75}
.qa .opt{flex:none;height:40px;padding:0 14px}
.qa .opt .av{margin-left:-8px}
.opt svg{width:16px;height:16px}
.sums{display:flex;flex-direction:column;gap:6px}
.sumrow{display:flex;gap:6px}
.sumrow .sum{flex:1 1 0;min-width:0}
.sum{min-width:0;justify-content:center;height:46px;padding:0 8px;border-radius:999px;background:var(--surface);display:flex;align-items:center;gap:6px;font-weight:700;font-size:14.5px;max-width:100%;white-space:nowrap}
.sum > svg{width:17px;height:17px;flex:none;color:var(--ink-2)}
.sum .car{flex:none;width:14px;height:14px;opacity:.6;transition:transform .2s}
.sum[aria-expanded="true"]{background:var(--ink);color:var(--bg)}
.sum[aria-expanded="true"] > svg{color:var(--bg)}
.sum[aria-expanded="true"] .car{transform:rotate(180deg)}
.sum .stack{display:flex;flex:none}
.sum .stack i{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font:800 10px/24px var(--f);text-align:center;font-style:normal;box-shadow:0 0 0 2px var(--surface)}
.sum .stack i + i{margin-left:-7px}
.sum .lbl{overflow:hidden;text-overflow:ellipsis}
.qpanel{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 2px}
.opt.new{background:transparent;border:2px dashed color-mix(in srgb,var(--peach-ink) 35%,transparent);color:var(--peach-ink)}
.tile.multi{font-size:13px}
/* calendar */
.cal{background:var(--surface);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:6px;max-width:380px;width:100%;box-sizing:border-box}
.calhead{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:16px}
.calhead button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.calhead button:hover{background:var(--soft)}
.calhead svg{width:16px;height:16px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.calgrid .wd{font-size:12px;color:var(--ink-3);font-weight:800;padding:4px 0}
.calgrid button{aspect-ratio:1;border-radius:50%;font-weight:700;font-size:15px;max-height:46px}
.calgrid button:hover{background:var(--soft)}
.calgrid button.past{color:var(--ink-3)}
.calgrid button.now{box-shadow:inset 0 0 0 2px var(--ink)}
.calgrid button[aria-pressed="true"]{background:var(--orange);color:#fff;box-shadow:none}
/* overdue strip */
.over{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--danger) 13%,var(--surface));border-radius:20px;padding:10px 10px 10px 18px;font-weight:800;color:var(--danger)}
.over button{margin-left:auto;flex:none;height:44px;padding:0 18px;border-radius:999px;background:var(--danger);color:#fff;font-weight:800}
.prog{font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--ink-2)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(30,18,10,.4);display:flex;align-items:flex-end;justify-content:center;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
.sheet{width:100%;box-sizing:border-box;max-width:560px;max-height:calc(100vh - env(safe-area-inset-top,0px) - 8px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 8px);overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:30px 30px 0 0;padding:14px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
@media (max-width:699px){.sheet{box-shadow:0 120px 0 0 var(--bg)}}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:30px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.sheethead{display:flex;align-items:center;gap:10px}
.sheet h4{margin:0;font-size:24px;font-weight:800;flex:1;min-width:0}
.closex{flex:none;width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--ink-2);display:grid;place-items:center;box-shadow:var(--shadow)}
.closex:hover{color:var(--ink);background:var(--soft)}
.closex svg{width:18px;height:18px}
.field{display:flex;flex-direction:column;gap:8px}
.field > span{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.remtoggle{width:100%;display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:10px 12px;min-height:60px;font-weight:700;font-size:17px;text-align:left;color:var(--ink);box-sizing:border-box}
.remtoggle .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--ink-2);flex:none}
.remtoggle .ic svg{width:20px;height:20px}
.remtoggle .lbl{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.remtoggle .lbl small{font-size:13px;font-weight:600;color:var(--ink-2)}
.remtoggle[aria-pressed="true"] .ic{background:var(--rem);color:var(--rem-ink)}
.remtoggle[aria-pressed="true"] .lbl small{color:var(--rem)}
.repcustom{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px;background:var(--surface);border-radius:18px;padding:12px 14px;font-weight:700}
.repcustom b{min-width:28px;text-align:center;font-size:20px}
.repcustom .stp{width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);font-size:22px;font-weight:700;line-height:1}
.repcustom .wrap{flex-basis:100%}
.switch{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.remtoggle[aria-pressed="true"] .switch{background:var(--rem)}
.remtoggle[aria-pressed="true"] .switch i{transform:translateX(20px)}
.remopts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opt.rq[aria-pressed="true"]{background:var(--rem);color:var(--rem-ink)}
.timerow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding:10px 14px 10px 18px;border-radius:20px;background:var(--surface);font-weight:800;font-size:17px;box-sizing:border-box}
.timerow input{font:inherit;font-size:20px;font-weight:800;color:var(--rem);background:var(--rem-soft);border:0;border-radius:14px;padding:10px 14px;min-width:0}
.remhint{font-size:14px;font-weight:600;color:var(--ink-2);padding:8px 4px 0}
.remhint.bad{color:var(--danger)}
.item.rem .card{background:var(--rem-soft);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rem) 32%,transparent),var(--shadow)}
.rempill{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;margin-top:3px;padding:3px 10px 3px 7px;border-radius:999px;background:var(--rem);color:var(--rem-ink);font-size:13px;font-weight:800;white-space:nowrap}
.rempill svg{width:14px;height:14px}
.rempill.past{background:transparent;color:var(--rem);box-shadow:inset 0 0 0 1.5px var(--rem)}
.chip.remchip{color:var(--rem)}
.chip.remchip .av{background:var(--rem);color:var(--rem-ink)}
.remwarn{width:100%;text-align:left;background:var(--rem-soft);color:var(--rem);border-radius:16px;padding:12px 14px;font-weight:700;font-size:15px}
.field input[type=text],.field textarea{border:2px solid transparent;background:var(--surface);border-radius:18px;padding:14px 16px;font-size:18px;font-weight:600;outline:none;width:100%;box-sizing:border-box}
.field textarea{font-weight:500;font-size:16px;min-height:74px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--orange)}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:42px;padding:0 16px;border-radius:999px;background:var(--surface);font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap}
.opt .av{width:26px;height:26px;margin-left:-10px;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--c);font-size:11px;display:grid;place-items:center;font-weight:800}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.opt[aria-pressed="true"] .av{background:var(--c);color:#fff}
.datewrap{position:relative}
.datewrap input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.swatch{width:44px;height:44px;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:inset 0 0 0 3px var(--bg)}
.swatch[aria-pressed="true"]{border-color:var(--c)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:110px;height:56px;border-radius:999px;font-weight:800;font-size:16px;background:var(--surface)}
.btn.primary{background:var(--brown);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#1a120c}}
.btn.danger{color:var(--danger);flex:none;min-width:0;padding:0 20px}
.btn.danger.armed{background:var(--danger);color:#fff}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;height:46px;border-radius:999px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stamp{font-size:14px;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 10px 10px 18px;border-radius:18px;font-weight:700;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 40px)}
.toast button{background:rgba(127,127,127,.3);color:inherit;padding:8px 14px;border-radius:12px;font-weight:800}
.warn{background:#FFC857;color:#3a2410;font-weight:700;font-size:14px;padding:12px 16px;border-radius:18px}
.updbar{background:var(--orange);color:#fff;font-weight:700;font-size:14px;padding:12px 16px;border-radius:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.updbar button{background:#fff;color:var(--orange);border:none;border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px}
@media (max-width:380px){.top h1{font-size:28px}.banner .art{width:80px;height:80px}.side{width:62px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* login */
.loginwrap{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.logincard{width:100%;max-width:360px;background:var(--surface);border-radius:26px;padding:28px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.logincard h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.logincard .sub{color:var(--ink-2);font-size:14px;margin-top:-8px}
.logincard label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.logincard input{height:52px;border-radius:16px;border:2px solid var(--line);background:var(--soft);padding:0 16px;font-size:16px;font-weight:600;outline:none;color:var(--ink)}
.logincard input:focus{border-color:var(--orange)}
.logincard .btn{height:52px;border-radius:16px;background:var(--brown);color:#fff;font-weight:800;font-size:16px;display:grid;place-items:center;margin-top:4px}
:root[data-theme="dark"] .logincard .btn{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logincard .btn{color:#1a120c}}
.logincard .err{color:var(--danger);font-size:13.5px;font-weight:700;min-height:1px}
.logincard .btn[disabled]{opacity:.6}
/* install helper */
.instcard{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9000;background:var(--peach);color:var(--peach-ink);border-radius:24px;padding:14px 14px 14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(60,30,10,.28);max-width:520px;margin:0 auto;box-sizing:border-box}
.instcard .ico{width:48px;height:48px;border-radius:12px;flex:none}
.instcard .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.instcard b{font-size:16px;font-weight:800}
.instcard small{font-size:13px;font-weight:600;opacity:.8}
.instcard .go{height:42px;padding:0 16px;border-radius:999px;background:var(--brown);color:#fff;font-weight:800;font-size:14px;border:0;flex:none}
:root[data-theme="dark"] .instcard .go{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .instcard .go{color:#1a120c}}
.instcard .x{width:30px;height:30px;border-radius:50%;background:transparent;color:inherit;opacity:.6;font-size:20px;line-height:1;border:0;flex:none}
.instfull{position:fixed;inset:0;z-index:9500;background:var(--bg);color:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.instfull .wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.instfull h3{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em;padding-right:44px}
.instfull .sub{color:var(--ink-2);font-size:15px;font-weight:600;margin:0 0 4px}
.instfull .close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:38px;height:38px;border-radius:50%;background:var(--surface);color:var(--ink);border:0;font-size:22px}
.istep{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.istep .n{width:34px;height:34px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
:root[data-theme="dark"] .istep .n{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .istep .n{color:#1a120c}}
.istep .itx{flex:1;min-width:0;font-weight:700;font-size:16px;line-height:1.25}
.istep .itx small{display:block;margin-top:3px;font-size:13px;font-weight:600;color:var(--ink-2)}
.istep .pic{width:128px;flex:none;border-radius:12px;overflow:hidden;background:#2a211c;line-height:0}
.istep .pic img,.istep .pic svg{width:100%;height:auto;display:block}
.itip{background:var(--peach);color:var(--peach-ink);border-radius:18px;padding:12px 14px;font-weight:700;font-size:15px;line-height:1.3}
.igo{height:54px;border-radius:18px;background:var(--orange);color:#fff;font-weight:800;font-size:17px;border:0;margin-top:2px}
:root[data-theme="dark"] .igo{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .igo{color:#1a120c}}
.instcopy{height:50px;border-radius:16px;background:var(--orange);color:#fff;font-weight:800;font-size:16px;border:0}
.inststrip{position:fixed;top:0;left:0;right:0;z-index:9400;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 8px;background:var(--orange);color:#fff;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
:root[data-theme="dark"] .inststrip{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .inststrip{color:#1a120c}}
.inststrip .st{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;line-height:1.2}
.inststrip .st span{white-space:nowrap}
.inststrip .st i{font-style:normal;opacity:.6}
.inststrip button{border:0;border-radius:999px;height:30px;padding:0 12px;background:rgba(255,255,255,.28);color:inherit;font-weight:800;font-size:13px;flex:none}
/* Ask Daybook chat */
.laterbar{display:flex;align-items:center;gap:12px;width:100%;margin-top:8px;padding:12px 14px;border:0;border-radius:20px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);text-align:left}
.laterbar .lic{width:40px;height:40px;border-radius:14px;background:var(--peach);color:var(--orange);display:grid;place-items:center;flex:none}
.laterbar .lic svg{width:20px;height:20px}
.laterbar .ltxt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.laterbar .ltxt b{font-size:17px;font-weight:800}
.laterbar .ltxt small{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-top:2px}
.laterbar .lcount{min-width:28px;height:28px;padding:0 9px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:800;display:grid;place-items:center}
.laterbar .lchev{width:22px;height:22px;color:var(--ink-3);transform:rotate(90deg);transition:transform .2s;display:grid;place-items:center}
.laterbar .lchev svg{width:18px;height:18px}
.laterbar.open .lchev{transform:rotate(-90deg)}
.item .delbtn{position:absolute;right:0;top:0;bottom:0;width:84px;border-radius:22px;background:var(--danger);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:700}
.item .delbtn svg{width:22px;height:22px}
.item .card{touch-action:pan-y}
.item:not(.swiped):not(.peek) .delbtn{visibility:hidden}
.item.swiped .card{transform:translateX(-92px)}
.shoptool{grid-column:1/-1}
.shoptool .lic{background:#DDF3E6;color:#2FA66A}
.beachbar{grid-column:1/-1;padding:8px 12px;margin-top:0}
.beachbar .lic{width:30px;height:30px;border-radius:11px;background:#FFF1C9;color:#C28A12}
.beachbar .lchev{transform:none}
.beachbar .lic svg{width:17px;height:17px}
.beachbar .ltxt b{font-size:15px}
.beachbar .ltxt small{font-size:12px;margin-top:1px}
.beachpanel{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;padding-bottom:96px}
.bhead{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;color:var(--ink-2);padding:2px 4px}
.bbtns{display:flex;gap:8px}
.bhead .bdanger{background:var(--danger);color:#fff}
.bhead button{border:0;background:var(--soft);color:var(--ink-2);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:800}
.bmovebtn{flex:none;width:30px;height:30px;border:0;background:transparent;color:var(--ink-3);border-radius:50%;display:grid;place-items:center;padding:0;position:relative}
.bmovebtn svg{width:17px;height:17px}
.bmovebtn::after{content:"";position:absolute;inset:-6px}
.bmovebtn.on{color:var(--orange)}
.bmove{background:var(--soft);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;margin-top:-2px}
.bmt{font-size:12.5px;font-weight:800;color:var(--ink-2)}
.bchips{display:flex;flex-wrap:wrap;gap:8px}
.bchip{border:0;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:800;background:var(--surface);color:var(--c);box-shadow:var(--shadow)}
.bmnew{display:flex;gap:8px}
.bmnew input{flex:1;min-width:0;height:40px;border-radius:14px;border:2px solid transparent;background:var(--surface);padding:0 12px;font-size:15px;font-weight:600;color:var(--ink);outline:none;box-sizing:border-box}
.bmnew input:focus{border-color:var(--orange)}
.bmnew button{height:40px;padding:0 16px;border:0;border-radius:14px;background:var(--brown);color:#fff;font-size:14px;font-weight:800}
.laterbar.half{grid-column:auto}
.tools .laterbar.kidsbar .lic.kav{background:none;width:auto;padding:0 2px;display:flex;align-items:center}
.kav i{position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 13px var(--f);font-style:normal;border:2px solid var(--surface);flex:none}
.kav i+i{margin-left:-10px}
.kav i{letter-spacing:-.02em}
.kav i img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.kav i b{position:absolute;right:-5px;bottom:-5px}
.kidsbar small .kup{color:#2FA66A}.kidsbar small .kdown{color:var(--danger)}
.ksnd{margin-left:auto;border:0;background:var(--surface);color:var(--ink);border-radius:999px;width:44px;height:44px;display:grid;place-items:center;box-shadow:var(--shadow)}
.kwk{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:0 4px;margin-top:-8px}
.kcard{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.ktop{display:flex;align-items:center;gap:12px}
.kface{position:relative;width:76px;height:76px;border-radius:20px;display:grid;place-items:center;flex:none;animation:kidle 2.4s ease-in-out infinite}
@keyframes kidle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.kj .kface{animation:kjoy .7s ease}
@keyframes kjoy{0%{transform:scale(1)}30%{transform:scale(1.15) translateY(-8px)}60%{transform:scale(.97)}100%{transform:scale(1)}}
.ko .kface{animation:kouch .55s ease}
@keyframes kouch{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-4deg)}40%{transform:translateX(7px) rotate(4deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.kpop{position:absolute;left:50%;top:-4px;display:flex;align-items:center;gap:4px;font:800 15px var(--f);color:#C98A00;pointer-events:none;animation:kpop .9s ease-out forwards}
@keyframes kpop{0%{opacity:0;transform:translate(-50%,20px)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px)}}
.krain{position:absolute;left:50%;top:-10px;transform:translateX(-50%);animation:krain 1s ease forwards}
@keyframes krain{0%{opacity:0}20%,70%{opacity:1}100%{opacity:0}}
.kphoto{width:100%;height:100%;border-radius:inherit;object-fit:cover;display:block}
.kface.hasphoto{padding:4px;border-radius:50%}
.kface.hasphoto.happy,.kface.hasphoto.smile{background:conic-gradient(#FFD23F,#2FA66A,#FFD23F,#2FA66A,#FFD23F)!important}
.kface.hasphoto.sad,.kface.hasphoto.cry{background:#9AA7B4!important}
.kface.hasphoto.sad .kphoto,.kface.hasphoto.cry .kphoto{filter:saturate(.55)}
.kface.hasphoto .kphoto{border-radius:50%}
.kcam{position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);background:var(--soft);font-size:14px;display:grid;place-items:center;padding:0;box-shadow:var(--shadow)}
.kcam::after{content:"";position:absolute;inset:-8px}
.kpick{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--soft);border-radius:16px;padding:16px;font:inherit;font-weight:800;font-size:16px;color:var(--ink);margin-top:10px;cursor:pointer;box-sizing:border-box;text-align:left}
.kpick.danger{color:var(--danger)}
.btn.kgo{background:var(--danger);color:#fff}
.kreset{align-self:center;border:0;background:var(--surface);color:var(--ink-2);border-radius:999px;padding:12px 20px;font:inherit;font-weight:800;font-size:14px;box-shadow:var(--shadow);min-height:44px}
.krs{margin-left:auto;font-size:13px;font-weight:700;color:var(--ink-2)}
.kconfirm{display:flex;flex-direction:column;gap:10px;background:var(--soft);border-radius:18px;padding:14px;margin:12px 0 14px;font-size:15px;font-weight:600}
.kconfirm div{display:flex;align-items:center;gap:10px}
.kconfirm small{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.caltool .lic{background:#FDE3E0;color:#E0473A}
.calbtn{border:0;background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;font-weight:800;font-size:13.5px;box-shadow:var(--shadow);min-height:40px}
.head .calbtn:first-of-type{margin-left:auto}
.calleg{display:flex;flex-wrap:wrap;gap:8px;margin-top:-6px}
.calchip{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:800;box-shadow:var(--shadow)}
.calchip i{width:10px;height:10px;border-radius:50%}

  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
  all:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>'
};

let db = null, synced = null;
let people = [], projects = [], tasks = [], shop = [], shopQ = '', shEditId = null, beach = [], notes = [], marks = [], markLabels = [], calScroll = false, kids = [], kidPts = [], kAnim = null, nProj = null, nFix = false, nQ = '', nShowFixed = false, nEditId = null, nFocus = false, bAddGrp = null, bConfirm = false, bMoveId = null, bQuick = null, bQFocus = false, bIFocus = false;
let sel = null;          // selected date
let filter = {personId:null, projectId:null};   // independent facets, either or both may be set
let mode = 'day';        // day | history
let histLimit = 60, showSomeday = false, tq = null, tsFocus = false;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const SYD = 'Australia/Sydney';
const _sf = new Intl.DateTimeFormat('en-CA',{timeZone:SYD,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
const sydP = ms => Object.fromEntries(_sf.formatToParts(new Date(ms)).map(x=>[x.type,x.value]));
const sydYmd = ms => { const p = sydP(ms); return `${p.year}-${p.month}-${p.day}`; };
const sydMs = (date,time) => { const [y,m,d]=date.split('-').map(Number), [h,mi]=time.split(':').map(Number); const off = t => { const p=sydP(t); return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second) - t; }; const g=Date.UTC(y,m-1,d,h,mi), f=g-off(g); return g-off(f); };
const today = () => sydYmd(Date.now());
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const mondayOf = s => { const d = parse(s); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return ymd(d); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const initials = n => (n||'?').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
function dayLabel(s){
  if(!s) return 'Someday';
  const diff = Math.round((parse(s) - parse(today()))/864e5);
  if(diff===0) return 'Today'; if(diff===1) return 'Tomorrow'; if(diff===-1) return 'Yesterday';
  const d = parse(s);
  if(diff>1 && diff<7) return d.toLocaleDateString('en-AU',{weekday:'long'});
  return d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
}
const longDate = s => parse(s).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const timeOf = ms => new Date(ms).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit',timeZone:SYD});
const hhmm = s => { if(!s) return ''; const [h,m] = s.split(':').map(Number); return new Date(2000,0,1,h,m).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}); };
const dateOfMs = ms => sydYmd(ms);
const ME_DEFAULT = {id:'me', name:'Me', color:'#EF7B2D', order:0, isMe:true};
const allPeople = () => { const p = [...people].sort((a,b)=>(b.isMe?1:0)-(a.isMe?1:0) || (a.order||0)-(b.order||0) || a.name.localeCompare(b.name)); return p.some(x=>x.id==='me') ? p : [ME_DEFAULT, ...p]; };
const allProjects = () => [...projects].sort((a,b)=>(a.order||0)-(b.order||0) || a.name.localeCompare(b.name));
const person = id => allPeople().find(p=>p.id===id) || ME_DEFAULT;
const project = id => projects.find(p=>p.id===id);
const byCreated = (a,b) => (a.date||'9999').localeCompare(b.date||'9999') || (a.createdAt||0)-(b.createdAt||0);
const pids = t => (Array.isArray(t.personIds) && t.personIds.length) ? t.personIds : [t.personId||'me'];
const prioRank = t => t.priority ? t.priority : Infinity;
const namesOf = ids => ids.map(i=>{ const p = person(i); return p.isMe?'Me':p.name; });
function passes(t){
  if(filter.personId && !pids(t).includes(filter.personId)) return false;
  if(filter.projectId && t.projectId!==filter.projectId) return false;
  return true;
}

/* ---------- writes (optimistic) ---------- */
function localApply(col, id, data){
  const arr = col==='tasks'?tasks:col==='shopping'?shop:col==='beach'?beach:col==='notes'?notes:col==='kids'?kids:col==='kid_points'?kidPts:col==='day_marks'?marks:col==='mark_labels'?markLabels:col==='people'?people:projects;
  const i = arr.findIndex(x=>x.id===id);
  if(data===null){ if(i>-1) arr.splice(i,1); }
  else if(i>-1) arr[i] = {id, ...data}; else arr.push({id, ...data});
}
async function put(col, id, data){
  localApply(col, id, data); render();
  if(!db) return;
  try{ await db.collection(col).doc(id).set(data); }
  catch(e){ toast(e && e.code==='quota_exceeded' ? 'Storage full — clear some old history' : 'Couldn’t save that change. Check your connection.'); }
}
async function del(col, id){
  localApply(col, id, null); render();
  if(!db) return;
  try{ await db.collection(col).doc(id).delete(); }catch(e){ toast('Couldn’t delete. Check your connection.'); }
}
const strip = o => { const c = {...o}; delete c.id; return c; };
const saveTask = t => put('tasks', t.id, strip(t));

const REPEATS = [['','Never'],['d1','Daily'],['w1','Weekly'],['w2','Every 2 weeks'],['m1','Monthly'],['m3','Every 3 months'],['m6','Every 6 months'],['y1','Yearly']];
const REPUNITS = {d:'day', w:'week', m:'month', y:'year'};
const repLabel = r => { if(!r) return ''; const p = REPEATS.find(x=>x[0]===r); if(p) return p[1]; const n = +r.slice(1) || 1; return `Every ${n} ${REPUNITS[r[0]]||'week'}${n>1?'s':''}`; };
const isPresetRep = r => REPEATS.some(x=>x[0] && x[0]===r);
function repField(s){
  const on = !!s.repeat;
  let h = `<button type="button" class="remtoggle" data-reptog aria-pressed="${on}"><span class="ic">${I.repeat}</span><span class="lbl">Repeat<small>${on ? esc(repLabel(s.repeat)) : 'Off · tap to repeat this task'}</small></span><span class="switch"><i></i></span></button>`;
  if(on){
    const custom = s.repCustom || !isPresetRep(s.repeat);
    h += `<div class="wrap" style="margin-top:10px">${REPEATS.filter(x=>x[0]).map(([v,l])=>`<button type="button" class="opt" data-rep="${v}" aria-pressed="${!custom && s.repeat===v}">${l}</button>`).join('')}<button type="button" class="opt" data-repcustom aria-pressed="${custom}">Custom…</button></div>`;
    if(custom){
      const u = s.repeat[0], n = +s.repeat.slice(1) || 1;
      h += `<div class="repcustom"><span>Every</span><button type="button" class="stp" data-repn="-1" aria-label="Less">−</button><b>${n}</b><button type="button" class="stp" data-repn="1" aria-label="More">+</button><div class="wrap">${Object.entries(REPUNITS).map(([k,l])=>`<button type="button" class="opt" data-repu="${k}" aria-pressed="${u===k}">${l}${n>1?'s':''}</button>`).join('')}</div></div>`;
    }
  }
  return h;
}
function addMonths(s,n){ const d = parse(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); return ymd(d); }
function stepDate(s,rule){ const k = rule[0], n = +rule.slice(1) || 1; return k==='d' ? addDays(s,n) : k==='w' ? addDays(s,7*n) : k==='m' ? addMonths(s,n) : addMonths(s,12*n); }
function nextDue(t){ const t0 = today(); let d = t.date || t0, i = 0; do { d = stepDate(d, t.repeat); } while(d <= t0 && ++i < 400); return d; }
function completeTask(id, el){
  const t = tasks.find(x=>x.id===id); if(!t) return;
  if(t.done){ saveTask({...t, done:false, doneAt:null}); return; }
  if(el) el.classList.add('completing');
  setTimeout(() => {
    saveTask({...t, done:true, doneAt:Date.now()});
    let nid = null, nd = null;
    if(t.repeat){
      nd = nextDue(t);
      if(!tasks.some(x=>!x.done && x.id!==id && x.repeat===t.repeat && x.title===t.title && x.date===nd)){
        nid = uid();
        saveTask({...t, id:nid, date:nd, done:false, doneAt:null, createdAt:Date.now(), remindAt:null, remindedAt:null});
      }
    }
    toast(nid ? 'Done · next ' + dayLabel(nd) : 'Nice — done', 'Undo', () => { const c = tasks.find(x=>x.id===id); if(c) saveTask({...c, done:false, doneAt:null}); if(nid) del('tasks', nid); });
  }, el ? 380 : 0);
}
function pushTask(id){
  const t = tasks.find(x=>x.id===id); if(!t) return;
  const tm = addDays(today(),1);
  const next = (!t.date || t.date < tm) ? tm : addDays(t.date,1);
  saveTask({...t, date:next});
  toast('Moved to ' + dayLabel(next), 'Undo', () => { const c = tasks.find(x=>x.id===id); if(c) saveTask({...c, date:t.date}); });
}
function moveOverdue(){
  const t0 = today();
  tasks.filter(t=>!t.done && t.date && t.date<t0 && passes(t)).forEach(t=>saveTask({...t, date:t0}));
  toast('Moved into today');
}

/* ---------- render ---------- */
function greeting(){ const h = +sydP(Date.now()).hour; return h<12?'Morning':h<17?'Afternoon':'Evening'; }
function openOn(d){ // open tasks shown on a date (today includes overdue)
  const t0 = today();
  return tasks.filter(t=>!t.done && passes(t) && (t.date===d || (d===t0 && t.date && t.date<t0)));
}
function renderWeek(){
  const t0 = today(), mon = mondayOf(sel);
  const names = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let days = '';
  for(let i=0;i<7;i++){
    const d = addDays(mon,i);
    const o = openOn(d); const hasOver = d===t0 && o.some(t=>t.date<t0);
    days += `<button class="day${d===t0?' today':''}" data-day="${d}" aria-pressed="${d===sel}" aria-label="${esc(longDate(d))}${o.length?`, ${o.length} tasks`:''}">
      <span class="dn">${names[i]}</span><span class="dc">${parse(d).getDate()}${o.length?`<span class="dot${hasOver?' red':''}"></span>`:''}</span></button>`;
  }
  const monthLbl = parse(mon).toLocaleDateString('en-AU',{month:'long',year:'numeric'});
  return `<section class="week"><div class="weekbar"><button class="arr" data-wk="-7" aria-label="Previous week">${I.left}</button><span>${esc(monthLbl)}</span><button class="arr" data-wk="7" aria-label="Next week">${I.right}</button>
    ${sel!==t0?`<button class="jump" data-day="${t0}">Back to today</button>`:''}</div><div class="days">${days}</div></section>`;
}
function renderOverdue(){
  const t0 = today();
  if(sel!==t0) return '';
  const n = tasks.filter(t=>!t.done && passes(t) && t.date && t.date<t0).length;
  return n ? `<div class="over">${n} overdue<button data-move-overdue>Move to today</button></div>` : '';
}
function renderTools(){
  const nShop = shop.filter(x=>!x.boughtAt).length;
  const nRem = tasks.filter(t=>!t.done && t.time && t.remindAt).length;
  const someday = tasks.filter(t=>!t.done && !t.date && passes(t)).sort((a,b)=>prioRank(a)-prioRank(b) || byCreated(a,b));
  let h = `<div class="chipgroups"><div><div class="chiplabel">Tools</div><div class="tools">`;
  h += `<button type="button" class="laterbar remtool" data-reminders aria-label="Show reminders"><span class="lic">${I.clock}</span><span class="ltxt"><b>Reminders</b><small>${nRem ? nRem + ' set' : 'None set'}</small></span></button>`;
  h += `<button type="button" class="laterbar" data-someday aria-label="Open Later"><span class="lic">${I.folder}</span><span class="ltxt"><b>Later</b><small>${someday.length ? ('Open') : 'Nothing saved'}</small></span><span class="lcount">${someday.length}</span></button>`;
  h += `<button type="button" class="laterbar shoptool" data-shopping aria-label="Open shopping list"><span class="lic">${I.cart}</span><span class="ltxt"><b>Shopping list</b><small>${nShop ? nShop + ' to buy' : 'Nothing to buy'}</small></span><span class="lcount">${nShop}</span></button>`;
  const nFixOpen = notes.filter(x=>x.kind==='fix'&&!x.done).length, half = kids.length ? ' half' : ' beachbar';
  h += `<button type="button" class="laterbar notebar${half}" data-notes aria-label="Open notes"><span class="lic">${I.note}</span><span class="ltxt"><b>Notes</b><small>${notes.length ? notes.length + ' note' + (notes.length>1?'s':'') + (nFixOpen ? ' · ' + nFixOpen + ' to fix' : '') : (kids.length ? 'Quick thoughts' : 'Quick thoughts, no pressure')}</small></span>${kids.length ? '' : `<span class="lchev">${I.right}</span>`}</button>`;
  if(kids.length) h += `<button type="button" class="laterbar kidsbar half" data-kids aria-label="Open kids game"><span class="lic kav">${allKids().map(k=>{ const sc = kidScore(k.id), ph = kidPhoto(k); return `<i style="background:${esc(k.color||'#3B82F6')}">${ph ? `<img src="${esc(ph)}" alt="">` : esc(kidInitial(k))}<b>${window.PX ? PX.face(PX.mood(sc.yes, sc.no), 1.1) : ''}</b></i>`; }).join('')}</span><span class="ltxt"><b>Kids</b><small>${allKids().map(k=>{ const sc = kidScore(k.id), d = sc.yes - sc.no; return `<span class="${d>0?'kup':d<0?'kdown':''}">${d>0?'+':d<0?'−':''}${Math.abs(d)}</span>`; }).join(' · ')}</small></span></button>`;
  h += renderCalTile() + renderBeach(true);
  h += `</div>`;
  return h + `</div></div>`;
}
const BGC = {Sun:'#C28A12', Water:'#3B82F6', Comfort:'#8B5CF6', Kids:'#E0509A', Essentials:'#2FA66A', General:'#13A3B5', Other:'#7B716B'};

const kidPhotoUrls = {};

function kidPhoto(k){

    kidPhotoUrls[k.photoPath] = 'pending';

      .catch(() => { delete kidPhotoUrls[k.photoPath]; });

}

function kidCropSheet(k, file){
  const root = $('#sheetRoot'); const url = URL.createObjectURL(file);
  const img = new Image();
  img.onerror = () => { URL.revokeObjectURL(url); toast('Couldn’t open that photo'); };
  img.onload = () => {
    const S = 260, base = Math.max(S/img.naturalWidth, S/img.naturalHeight);
    const st = {z:1, x:0, y:0};
    root.innerHTML = `<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="Crop photo">
      <div class="grab"></div><div class="sheethead"><h4>Move and zoom</h4><button type="button" class="closex" data-ks="cancel" aria-label="Close">${I.x}</button></div>
      <div class="kstage" id="kStage" style="width:${S}px;height:${S}px"><img id="kImg" src="${url}" alt="" draggable="false"></div>
      <input type="range" id="kZoom" min="1" max="3" step="0.01" value="1" aria-label="Zoom" class="kzoom">
      <div class="btns"><button class="btn" data-ks="cancel">Cancel</button><button class="btn primary" data-ks="save">Save photo</button></div>
    </div></div>`;
    const el = $('#kImg'), stage = $('#kStage');
    const size = () => ({w:img.naturalWidth*base*st.z, h:img.naturalHeight*base*st.z});
    const clamp = () => { const {w,h} = size(); st.x = Math.min(0, Math.max(S-w, st.x)); st.y = Math.min(0, Math.max(S-h, st.y)); };
    const draw = () => { clamp(); const {w,h} = size(); el.style.width = w+'px'; el.style.height = h+'px'; el.style.transform = `translate(${st.x}px,${st.y}px)`; };
    { const {w,h} = size(); st.x = (S-w)/2; st.y = (S-h)/2; }
    draw();
    let drag = null;
    stage.addEventListener('pointerdown', e => { drag = {px:e.clientX, py:e.clientY, x:st.x, y:st.y}; try{ stage.setPointerCapture(e.pointerId); }catch(_){} });
    stage.addEventListener('pointermove', e => { if(!drag) return; st.x = drag.x + e.clientX - drag.px; st.y = drag.y + e.clientY - drag.py; draw(); });
    const up = () => { drag = null; }; stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
    $('#kZoom').addEventListener('input', e => { const {w,h} = size(); const cx = (S/2 - st.x)/w, cy = (S/2 - st.y)/h; st.z = +e.target.value; const n = size(); st.x = S/2 - cx*n.w; st.y = S/2 - cy*n.h; draw(); });
    root.onchange = null;
    root.onclick = async e => {
      if(e.target.matches('[data-scrim]')){ closeSheet(); URL.revokeObjectURL(url); return; }
      const b = e.target.closest('[data-ks]'); if(!b) return;
      if(b.dataset.ks==='cancel'){ closeSheet(); URL.revokeObjectURL(url); return; }
      if(b.dataset.ks==='save'){
        b.disabled = true; b.textContent = 'Saving…';
        const OUT = 512, f = OUT/S, {w,h} = size();
        const cv = document.createElement('canvas'); cv.width = OUT; cv.height = OUT;
        const c2 = cv.getContext('2d'); c2.fillStyle = '#fff'; c2.fillRect(0,0,OUT,OUT);
        c2.drawImage(img, st.x*f, st.y*f, w*f, h*f);
        cv.toBlob(async blob => {
          try{ await kidPhotoSave(k, blob); closeSheet(); toast(k.name + "'s photo saved"); }
          catch(err){ b.disabled = false; b.textContent = 'Save photo'; toast('Couldn’t save the photo. Check your connection.'); }
          URL.revokeObjectURL(url);
        }, 'image/jpeg', 0.85);
      }
    };
  };
  img.src = url;
}
async function kidPhotoSave(k, blob){
  if(!blob) throw new Error('no image');

  const up = await sb.storage.from('kid-photos').upload(path, blob, {contentType:'image/jpeg', upsert:false});
  if(up.error) throw up.error;
  const {error} = await sb.from('kids').update({photo_path:path}).eq('id', k.id);
  if(error){ sb.storage.from('kid-photos').remove([path]); throw error; }
  const old = k.photoPath; k.photoPath = path;
  kidPhotoUrls[path] = PX.photoPut(path, blob);
  PX.photoPrune(kids.map(x=>x.photoPath).filter(Boolean));
  render();
  if(old) sb.storage.from('kid-photos').remove([old]);
}

async function kidReset(ids){
  const now = Date.now();
  const before = ids.map(id => { const k = kids.find(x=>x.id===id); return {id, resetAt:k ? k.resetAt : null}; });
  const {error} = await sb.from('kids').update({reset_at:now}).in('id', ids);
  if(error){ toast('Couldn’t reset. Check your connection.'); return; }
  ids.forEach(id => { const k = kids.find(x=>x.id===id); if(k) k.resetAt = now; });
  closeSheet(); render();
  const names = ids.length>1 ? 'Everyone' : (kids.find(x=>x.id===ids[0]) || {}).name;
  toast(names + ' reset to 0', 'Undo', async () => {
    for(const b of before){
      const {error:e2} = await sb.from('kids').update({reset_at:b.resetAt}).eq('id', b.id);
      if(!e2){ const k = kids.find(x=>x.id===b.id); if(k) k.resetAt = b.resetAt; }
    }
    render();
  });
}

const _hijriMonth = new Intl.DateTimeFormat('ar-u-ca-islamic-civil', {month:'long', timeZone:'UTC'});
const hijriCache = {};
function hijri(ymdStr){
  if(hijriCache[ymdStr]) return hijriCache[ymdStr];
  const [y,m,d] = ymdStr.split('-').map(Number), dt = new Date(Date.UTC(y,m-1,d));
  let day = ''; try{ day = _hijriDay.format(dt).replace(/\D/g,''); }catch(_){}

  return hijriCache[ymdStr] = {day, label, first: day === '1'};
}

function renderLater(){

function renderReminders(){
  const now = Date.now();

  let h = `<button class="back" data-back>${I.left}Back</button><div class="head"><h3 style="font-size:28px">Reminders</h3><span class="ts" style="margin-left:auto">${list.length} set</span></div>`;

  if(!list.length) return h + `<div class="empty"><b>No reminders yet</b>Open a task and switch on “Remind me”, or say “remind me at 3pm to…”.</div>`;
  const past = list.filter(t=>t.remindAt<=now), next = list.filter(t=>t.remindAt>now);

function renderHistory(){
  const done = tasks.filter(t=>t.done && t.doneAt && passes(t)).sort((a,b)=>b.doneAt-a.doneAt);

  const days = [...new Set(shown.map(t=>dateOfMs(t.doneAt)))];
  let h = `<button class="back" data-back>${I.left}Back</button><div class="head"><h3 style="font-size:28px">History</h3><span class="ts" style="margin-left:auto">${done.length} finished</span></div>`;
  h += renderChips();
  if(!done.length) h += `<div class="empty"><b>Nothing finished yet</b>Finished tasks land here with the date and time.</div>`;
  days.forEach(d => { const l = shown.filter(t=>dateOfMs(t.doneAt)===d);
    h += `<div class="histday">${esc(dayLabel(d))}<span>${esc(parse(d).toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'}))} · ${l.length} done</span></div><div class="list">${l.map(t=>item(t)).join('')}</div>`; });

function renderOverview(){
  const t0 = today();
  const doneAll = tasks.filter(t=>t.done && t.doneAt);
  const doneToday = doneAll.filter(t=>dateOfMs(t.doneAt)===t0).length;
  const wkStart = mondayOf(t0);
  const doneThisWeek = doneAll.filter(t=>{ const d = dateOfMs(t.doneAt); return d>=wkStart && d<=t0; }).length;
  const openCount = tasks.filter(t=>!t.done).length;
  const overdueCount = tasks.filter(t=>!t.done && t.date && t.date<t0).length;
  const tiles = [
    {n:doneToday, l:'Done today'}, {n:doneThisWeek, l:'Done this week'},
    {n:openCount, l:'Open tasks'}, {n:overdueCount, l:'Overdue'}
  ];
  const tilesHTML = `<div class="ovgrid">${tiles.map(x=>`<div class="ovtile"><span class="num">${x.n}</span><span class="lbl">${x.l}</span></div>`).join('')}</div>`;

  const days = Array.from({length:7}, (_,i)=>addDays(t0, i-6));
  const counts = days.map(d => doneAll.filter(t=>dateOfMs(t.doneAt)===d).length);
  const maxC = Math.max(1, ...counts);
  const trendHTML = `<div class="ovsec"><h4>Last 7 days · finished</h4><div class="ovtrend">${days.map((d,i)=>{
    const h = counts[i] ? Math.round((counts[i]/maxC)*74)+6 : 4;
    const wd = parse(d).toLocaleDateString('en-AU',{weekday:'short'})[0];
    return `<div class="col" title="${esc(dayLabel(d))} · ${counts[i]} done"><span class="v">${counts[i]}</span><div class="colbar" style="height:${h}px"></div><span class="d">${esc(wd)}</span></div>`;
  }).join('')}</div></div>`;

  const ppl = allPeople();
  const teamCounts = ppl.map(p => ({p, n: tasks.filter(t=>!t.done && pids(t).includes(p.id)).length}));
  const maxT = Math.max(1, ...teamCounts.map(x=>x.n));
  const teamHTML = ppl.length ? `<div class="ovsec"><h4>Team · open tasks</h4>${teamCounts.map(({p,n})=>`<div class="ovrow"><span class="av" style="--c:${p.color}">${esc(initials(p.isMe?'Me':p.name))}</span><span class="nm">${esc(p.isMe?'Me':p.name)}</span><span class="ovbar"><i style="--c:${p.color};width:${n?Math.round(n/maxT*100):0}%"></i></span><span class="n">${n}</span></div>`).join('')}</div>` : '';

  let projHTML = '';
  if(allProjects().length){
    const projCounts = allProjects().map(pr => ({pr, n: tasks.filter(t=>!t.done && t.projectId===pr.id).length}));
    const maxP = Math.max(1, ...projCounts.map(x=>x.n));
    projHTML = `<div class="ovsec"><h4>Projects · open tasks</h4>${projCounts.map(({pr,n})=>`<div class="ovrow"><span class="av" style="--c:${pr.color}">${I.folder}</span><span class="nm">${esc(pr.name)}</span><span class="ovbar"><i style="--c:${pr.color};width:${n?Math.round(n/maxP*100):0}%"></i></span><span class="n">${n}</span></div>`).join('')}</div>`;
  }
  return `<button class="back" data-back>${I.left}Back</button><div class="head"><h3 style="font-size:28px">Overview</h3></div>${tilesHTML}${trendHTML}${teamHTML}${projHTML}`;
}

function applyTheme(){
  const r = document.documentElement;
  if(themePref==='light' || themePref==='dark') r.setAttribute('data-theme', themePref);
  else if(HOST_THEME) r.setAttribute('data-theme', HOST_THEME); else r.removeAttribute('data-theme');

function isDark(){

}

const monthStart = s => s.slice(0,8)+'01';
const shiftMonth = (s,n) => { const d = parse(s); return ymd(new Date(d.getFullYear(), d.getMonth()+n, 1)); };
function whenOpts(s){
  const t = today(), tm = addDays(t,1), nw = addDays(t,7);
  const custom = s.date && ![t,tm,nw].includes(s.date);
  const o = (v,l) => `<button type="button" class="opt" data-d="${v??''}" aria-pressed="${!s.calOpen && s.date===v}">${l}</button>`;
  return `${o(t,'Today')}${o(tm,'Tomorrow')}<button type="button" class="opt" data-calpick aria-expanded="${!!s.calOpen}" aria-pressed="${!!custom || !!s.calOpen}">${I.cal}${custom?esc(dayLabel(s.date)):'Pick date'}</button>${o(nw,'Next week')}${o(null,'Later')}`;
}
function calHTML(s){
  const m = parse(s.calMonth), y = m.getFullYear(), mo = m.getMonth();
  const lead = (new Date(y,mo,1).getDay()+6)%7, n = new Date(y,mo+1,0).getDate(), t0 = today();
  let c = ['M','T','W','T','F','S','S'].map(d=>`<span class="wd">${d}</span>`).join('');
  for(let i=0;i<lead;i++) c += '<span></span>';
  for(let d=1; d<=n; d++){ const v = ymd(new Date(y,mo,d)); c += `<button type="button" data-cal="${v}" class="${v<t0?'past':''}${v===t0?' now':''}" aria-pressed="${v===s.date}" aria-label="${esc(longDate(v))}">${d}</button>`; }
  return `<div class="cal"><div class="calhead"><button type="button" data-calm="-1" aria-label="Previous month">${I.left}</button><span>${esc(m.toLocaleDateString('en-AU',{month:'long',year:'numeric'}))}</span><button type="button" data-calm="1" aria-label="Next month">${I.right}</button></div><div class="calgrid">${c}</div></div>`;
}
function handleWhen(b, s){
  if('d' in b.dataset){ s.date = b.dataset.d || null; s.calOpen = false; return true; }
  if('calpick' in b.dataset){ s.calOpen = !s.calOpen; s.calMonth = monthStart(s.date || today()); return true; }
  if(b.dataset.cal){ s.date = b.dataset.cal; s.calOpen = false; return true; }
  if(b.dataset.calm){ s.calMonth = shiftMonth(s.calMonth, +b.dataset.calm); return true; }

/* notes swipe: left = reveal Delete, right = make task (touch and mouse) */
(function(){
  const app = document.getElementById('app'); const W = 92, GO = 110;
  let st = null, just = false;
  const closeN = except => document.querySelectorAll('.nsw.swiped').forEach(el => { if(el!==except){ el.classList.remove('swiped'); const c = el.querySelector('.nrow'); if(c) c.style.transform = ''; } });
  app.addEventListener('pointerdown', e => {
    if(e.pointerType==='mouse' && e.button!==0) return;
    const c = e.target.closest('.nrow');
    if(!c || e.target.closest('.nedit,.npin,.shtick')){ if(!e.target.closest('.nsw')) closeN(); st = null; return; }
    const it = c.closest('.nsw'); closeN(it);
    st = {id:e.pointerId, x:e.clientX, y:e.clientY, c, it, lock:null, base: it.classList.contains('swiped') ? -W : 0, dx:0};
  });
  app.addEventListener('pointermove', e => {
    if(!st || e.pointerId!==st.id) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if(st.lock===null){
      if(Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)*1.4){ st.lock = 'x'; try{ st.c.setPointerCapture(e.pointerId); }catch(_){} }
      else if(Math.abs(dy) > 8){ st = null; return; }
      else return;
    }
    const x = Math.max(-W-24, Math.min(160, st.base + dx));
    st.dx = dx; st.it.classList.toggle('peek', x<0); st.it.classList.toggle('peekr', x>0);
    st.c.style.transition = 'none'; st.c.style.transform = 'translateX(' + x + 'px)';
  });
  const end = e => {
    if(!st || e.pointerId!==st.id) return;
    const {c, it, lock, base, dx} = st; st = null;
    c.style.transition = ''; it.classList.remove('peek','peekr');
    if(lock !== 'x') return;
    just = true; setTimeout(()=>{ just = false; }, 350);
    const final = base + dx;
    if(final > GO){ c.style.transform = ''; noteToTask(it.dataset.nsw); }
    else if(final < -W/2){ it.classList.add('swiped'); c.style.transform = 'translateX(' + (-W) + 'px)'; }
    else { it.classList.remove('swiped'); c.style.transform = ''; }
  };
  app.addEventListener('pointerup', end);
  app.addEventListener('pointercancel', end);
  app.addEventListener('click', e => {
    if(just){ e.stopPropagation(); e.preventDefault(); return; }
    const sw = e.target.closest('.nsw');
    if(sw && sw.classList.contains('swiped') && !e.target.closest('.ndel')){ e.stopPropagation(); e.preventDefault(); closeN(); }
  }, true);
})();

        async set(data){ const {error} = await sb.from(col).upsert({id, ...IN[col](data)}); if(error) throw error; },

  async function undo(i){
    var m = msgs[i]; if(!m || !m.chatId || m.undone) return;
    try { var r = await call({ action: 'undo', chat_id: m.chatId }); if(r.undone){ m.undone = true; if(window.__toast) window.__toast(r.reply || 'Undone'); } else if(window.__toast) window.__toast(r.reply || 'Couldn’t undo'); }
    catch(e){ if(window.__toast) window.__toast('Couldn’t undo'); }
    draw();
  }
  function pairText(m, i){
    var u = msgs[i-1]; return 'You: ' + (u ? u.text : '') + '\nDaybook: ' + m.text;
  }
  async function loadHist(){
    hist.loading = true; hist.err = ''; drawHist();
    try {
      var r = await window.__sb.from('chat_log').select('id,created_at,source,prompt,reply,changed,undone,model,ms,error').order('created_at', { ascending: false }).limit(hist.limit);
      if(r.error) throw r.error;
      hist.rows = r.data || []; hist.more = hist.rows.length >= hist.limit;
    } catch(e){ hist.err = 'Couldn’t load history.'; }
    hist.loading = false; drawHist();
  }
  function filtered(){
    return hist.rows.filter(function(r){ return hist.filter === 'all' || (hist.filter === 'changed' ? r.changed : r.source === hist.filter); });
  }
  function drawHist(){
    if(!wrap || view !== 'hist') return;
    var rows = filtered(), last = '';
    var chips = [['all','All'],['app','App'],['voice','Voice'],['changed','Changed']].map(function(c){ return '<button type="button" class="chip2' + (hist.filter === c[0] ? ' on' : '') + '" data-a="filt" data-f="' + c[0] + '">' + c[1] + '</button>'; }).join('');
    var list = '';
    if(hist.loading) list = '<div class="note" style="padding:20px;text-align:center">Loading…</div>';
    else if(hist.err) list = '<div class="note" style="padding:20px;text-align:center">' + esc(hist.err) + '</div>';
    else if(!rows.length) list = '<div class="note" style="padding:20px;text-align:center">Nothing here yet.</div>';
    else rows.forEach(function(r){
      var d = dayLbl(r.created_at); if(d !== last){ list += '<div class="hday">' + esc(d) + '</div>'; last = d; }
      list += '<div class="hcard"><div class="m"><span>' + esc(hm(r.created_at)) + '</span><span class="tag">' + (r.source === 'voice' ? '🎙 Voice' : '💬 App') + '</span>' + (r.changed ? '<span class="tag ch">' + (r.undone ? 'Changed · undone' : 'Changed') + '</span>' : '') + (r.error ? '<span class="tag bad">Error</span>' : '') + (r.model || r.ms ? '<span>' + esc([r.model ? String(r.model).replace('claude-','').replace(/-\d{8}$/,'') : '', r.ms ? (r.ms/1000).toFixed(1) + 's' : ''].filter(Boolean).join(' · ')) + '</span>' : '') + '</div>' +
        '<div class="p">' + esc(r.prompt) + '</div><div class="r">' + esc(r.reply || '') + '</div><div class="f"><button type="button" data-a="hcopy" data-id="' + esc(r.id) + '">Copy</button>' + (r.source === 'app' ? '<button type="button" data-a="reuse" data-id="' + esc(r.id) + '">Reuse prompt</button>' : '') + '</div></div>';
    });
    wrap.innerHTML = '<div class="askhead"><button type="button" class="ib" data-a="chat" aria-label="Back to chat">' + IC.back + '</button><div class="tt"><b>History</b><span>Prompts and answers</span></div><button type="button" class="ib" data-a="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg></button></div><div class="askbody"><div class="hbar">' + chips + '</div><div class="hbar"><span class="note">' + rows.length + ' shown</span><span class="sp"></span><button type="button" class="chip2" data-a="copyall">Copy all</button></div>' + list + (hist.more && !hist.loading ? '<button type="button" class="chip2" data-a="more" style="align-self:center">Load more</button>' : '') + '</div>';
  }
  function fmtAll(rows){
    return rows.map(function(r){ return '[' + new Date(r.created_at).toLocaleString('en-AU') + '] ' + (r.source === 'voice' ? 'Voice' : 'App') + (r.changed ? ' · changed' : '') + (r.undone ? ' · undone' : '') + '\nYou: ' + r.prompt + '\nDaybook: ' + (r.reply || ''); }).join('\n\n');
  }
  function fmtSheet(rows){
    var q = function(s){ return '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"'; };
    var head = ['Time','Source','Prompt','Reply','Changed','Undone','Model','Seconds','Error'].join('\t');
    return head + '\n' + rows.map(function(r){ var d = new Date(r.created_at); return [ymd(d) + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'), r.source, q(r.prompt), q(r.reply), r.changed ? 'yes' : 'no', r.undone ? 'yes' : 'no', r.model || '', r.ms ? (r.ms/1000).toFixed(1) : '', q(r.error)].join('\t'); }).join('\n');
  }
  function onClick(e){
    var b = e.target.closest('[data-a]'); if(!b) return;
    var a = b.dataset.a;
    if(a === 'close') close();
    else if(a === 'send') send();
    else if(a === 'ask') send(b.dataset.q);
    else if(a === 'copymsg') copy(pairText(msgs[+b.dataset.i], +b.dataset.i));
    else if(a === 'undo') undo(+b.dataset.i);
    else if(a === 'mic') mic();
    else if(a === 'speak') speak(+b.dataset.i);
    else if(a === 'hist'){ stopSpeak(); view = 'hist'; drawHist(); loadHist(); }
    else if(a === 'chat'){ view = 'chat'; draw(); }
    else if(a === 'refresh') loadHist();
    else if(a === 'filt'){ hist.filter = b.dataset.f; drawHist(); }
    else if(a === 'more'){ hist.limit += 200; loadHist(); }
    else if(a === 'copyall') copy(fmtAll(filtered()));
    else if(a === 'hcopy'){ var r = hist.rows.find(function(x){ return x.id === b.dataset.id; }); if(r) copy(fmtAll([r])); }
    else if(a === 'reuse'){ var r2 = hist.rows.find(function(x){ return x.id === b.dataset.id; }); if(r2){ view = 'chat'; draw(); var t = wrap.querySelector('#askIn'); t.value = r2.prompt; grow(t); t.setSelectionRange(t.value.length, t.value.length); wrap.querySelector('.send').disabled = false; try{ t.focus({ preventScroll: true }); }catch(e){ t.focus(); } } }
  }
  function mount(){
    fab = document.createElement('button'); fab.type = 'button'; fab.className = 'askfab'; fab.setAttribute('aria-label', 'Ask Daybook'); fab.innerHTML = SPARK;
    fab.addEventListener('click', open); document.body.appendChild(fab);
    var app = document.getElementById('app');
    var sync = function(){ fab.classList.toggle('on', !!app && app.style.display !== 'none'); };
    if(app){ new MutationObserver(sync).observe(app, { attributes: true, attributeFilter: ['style'] }); }
    sync();
  }
  window.dbAsk = { open: open };
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
</script>
</script>
