<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Daybook</title>
<meta name="description" content="Idris's shared to-do app — team, projects, and personal tasks, synced everywhere.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5A2D12">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daybook">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F3EDEA; --bg-2:#F6E3D6; --surface:#FFFFFF; --soft:#F7F2EF; --ink:#1F1A17; --ink-2:#7B716B; --ink-3:#B0A6A0;
  --line:#EAE1DC; --orange:#EF7B2D; --brown:#5A2D12; --peach:#F9D8BF; --peach-ink:#5A2D12; --danger:#E0473A;
  --rem:#6A55E8; --rem-soft:#F0EDFF; --rem-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(60,30,10,.04),0 8px 24px rgba(60,30,10,.06);
  --f:"Urbanist",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#15110E; --bg-2:#241710; --surface:#211B17; --soft:#2A231E; --ink:#F6EFEA; --ink-2:#B3A69D; --ink-3:#6F645D;
    --line:#342B25; --orange:#F48A40; --brown:#F48A40; --peach:#3B2517; --peach-ink:#FFD9BD; --danger:#FF6B5E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#15110E; --bg-2:#241710; --surface:#211B17; --soft:#2A231E; --ink:#F6EFEA; --ink-2:#B3A69D; --ink-3:#6F645D;
  --line:#342B25; --orange:#F48A40; --brown:#F48A40; --peach:#3B2517; --peach-ink:#FFD9BD; --danger:#FF6B5E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
html{min-height:100%;overflow-x:hidden;overscroll-behavior-x:none;touch-action:manipulation;background-color:var(--bg-2);background-image:linear-gradient(180deg,var(--bg) 55%,var(--bg-2));background-attachment:fixed}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#33190A;z-index:60;pointer-events:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body::before{background:var(--bg)}}
:root[data-theme="dark"] body::before{background:var(--bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--rem:#A99BFF;--rem-soft:#231E33;--rem-ink:#15101F}}
:root[data-theme="dark"]{--rem:#A99BFF;--rem-soft:#231E33;--rem-ink:#15101F}
body{min-height:100%;max-width:100%;overflow-x:hidden;touch-action:manipulation;background:transparent;color:var(--ink);font:500 16px/1.4 var(--f);-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:12px}
.app{max-width:640px;margin:0 auto;padding-inline:20px;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
#warn:empty,#updbar:empty{display:none}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:clamp(24px,6.6vw,34px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.top .sub{color:var(--ink-2);font-size:16px;font-weight:500;margin-top:6px}
.me{flex:none;width:50px;height:50px;border-radius:50%;background:var(--peach);color:var(--peach-ink);font-size:22px;font-weight:800;display:grid;place-items:center;position:relative}
.me .badge{position:absolute;right:-2px;top:-2px;width:22px;height:22px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--shadow)}
.me .badge svg{width:13px;height:13px}
.hbtns{display:flex;gap:8px;flex:none}
.hb{width:50px;height:50px;border-radius:50%;background:var(--surface);color:var(--ink-2);display:grid;place-items:center;box-shadow:var(--shadow)}
.hb svg{width:22px;height:22px}
.setgroup{background:var(--surface);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.setrow{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px;border-top:1px solid var(--line);text-align:left;width:100%;box-sizing:border-box}
.setrow:first-child{border-top:0}
button.setrow:hover{background:var(--soft)}
.setrow .av{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--c);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.setrow .av svg{width:17px;height:17px}
.setrow .nm{flex:1;min-width:0;font-weight:700;font-size:16px}
.setrow .meta{color:var(--ink-3);font-size:14px;font-weight:600}
.setrow.addrow{color:var(--orange);font-weight:800}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme{border-radius:18px;background:var(--surface);padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;border:3px solid transparent}
.theme[aria-pressed="true"]{border-color:var(--orange)}
.theme .pv{width:100%;height:58px;border-radius:12px;display:flex;flex-direction:column;gap:5px;padding:9px;box-sizing:border-box}
.theme .pv i{display:block;height:9px;border-radius:5px}
.pv.light{background:#F3EDEA}.pv.light i{background:#fff}.pv.light i:first-child{background:#F9D8BF;width:70%}
.pv.dark{background:#15110E}.pv.dark i{background:#211B17}.pv.dark i:first-child{background:#3B2517;width:70%}
.pv.auto{background:linear-gradient(135deg,#F3EDEA 50%,#15110E 50%)}.pv.auto i{background:rgba(127,127,127,.35)}.pv.auto i:first-child{background:#EF7B2D;width:70%}
.setnote{font-size:13px;color:var(--ink-3);padding:0 4px}
.numdot{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;font-weight:800;font-size:12px;flex:none}
:root[data-theme="dark"] .numdot{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .numdot{color:#1a120c}}
.sum.pri[aria-expanded="true"]{background:var(--orange);color:#fff}
:root[data-theme="dark"] .sum.pri[aria-expanded="true"]{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sum.pri[aria-expanded="true"]{color:#1a120c}}
.numgrid{display:flex;flex-wrap:wrap;gap:8px}
.opt.num{width:46px;height:46px;padding:0;border-radius:50%;justify-content:center;font-weight:800;font-size:17px}
.opt.num[aria-pressed="true"]{background:var(--orange);color:#fff}
:root[data-theme="dark"] .opt.num[aria-pressed="true"]{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt.num[aria-pressed="true"]{color:#1a120c}}

.grouphead{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:2px 4px 0}
.grouphead.done{color:var(--ink-3)}

/* week strip */
.week{display:flex;flex-direction:column;gap:10px}
.weekbar{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ink-2);font-size:14px}
.weekbar .arr{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.weekbar .arr:hover{background:var(--surface)}
.weekbar .arr svg{width:16px;height:16px}
.weekbar .jump{margin-left:auto;font-size:13px;font-weight:800;color:var(--orange);padding:6px 10px;border-radius:999px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:8px}
.day .dn{font-size:15px;color:var(--ink-2);font-weight:500}
.day .dc{width:100%;max-width:52px;aspect-ratio:1;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:18px;font-weight:600;position:relative;transition:transform .15s}
.day .dot{position:absolute;bottom:7px;width:5px;height:5px;border-radius:50%;background:var(--orange)}
.day .dot.red{background:var(--danger)}
.day.today .dn{color:var(--ink);font-weight:800}
.day.today .dc{box-shadow:inset 0 0 0 2px var(--ink)}
.day[aria-pressed="true"] .dc{background:var(--ink);color:var(--bg);box-shadow:none}
.day[aria-pressed="true"] .dot{background:var(--bg)}
.day:active .dc{transform:scale(.94)}

/* banner */
.banner{background:var(--peach);border-radius:26px;padding:22px 20px 22px 22px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.banner .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.banner h2{margin:0;font-size:22px;font-weight:800;color:var(--peach-ink);letter-spacing:-.01em}
.banner p{margin:0;color:var(--peach-ink);opacity:.8;font-size:15px;line-height:1.35}
.banner .cta{align-self:flex-start;margin-top:8px;height:44px;padding:0 20px;border-radius:999px;background:var(--brown);color:#fff;font-weight:700;font-size:15px}
:root[data-theme="dark"] .banner .cta{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner .cta{color:#1a120c}}
.banner .art{flex:none;width:104px;height:104px}
.bar{height:8px;border-radius:9px;background:rgba(90,45,18,.14);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--orange);border-radius:9px;transition:width .4s}

/* filter chips */
.chipgroups{display:flex;flex-direction:column;gap:8px}
.chiplabel{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;padding:0 16px 0 6px;border-radius:999px;background:var(--surface);display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}
.chip.plain{padding-left:16px}
.chip .av{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--c);display:grid;place-items:center;font-size:12px;font-weight:800}
.chip .av svg{width:15px;height:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .av{background:var(--c);color:#fff}
.chip.add{width:42px;padding:0;justify-content:center;border:2px dashed var(--line);background:transparent;color:var(--ink-2);font-size:22px}

/* list */
.head{display:flex;align-items:center;gap:10px}
.head h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.head .edit{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.head .edit svg{width:16px;height:16px}
.head .link{margin-left:auto;font-size:15px;font-weight:600;color:var(--ink);padding:6px 4px}
.sublabel{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 -4px 40px}
.sublabel.red{color:var(--danger)}
.list{display:flex;flex-direction:column;gap:12px;position:relative}
.list::before{content:"";position:absolute;left:11px;top:30px;bottom:30px;border-left:2px dotted var(--line)}
.item{display:flex;align-items:center;gap:14px;position:relative}
.tick{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-3);background:var(--bg);display:grid;place-items:center;color:#fff;position:relative;z-index:1}
.tick::after{content:"";position:absolute;inset:-12px}
.tick svg{width:13px;height:13px;opacity:0}
.tick:hover{border-color:var(--orange)}
.item.done .tick,.item.completing .tick{background:var(--orange);border-color:var(--orange)}
.item.done .tick svg,.item.completing .tick svg{opacity:1}
.card{position:relative;flex:1;min-width:0;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);display:flex;align-items:center;min-height:76px;transition:opacity .35s,transform .35s}
.card .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 8px 12px 4px;text-align:left}
.tile{flex:none;width:42px;height:42px;margin:0 0 0 12px;border-radius:14px;background:color-mix(in srgb,var(--c) 20%,var(--surface));color:var(--c);display:grid;place-items:center;font-weight:800;font-size:16px;transition:background .15s}
button.tile:active{background:color-mix(in srgb,var(--c) 34%,var(--surface))}
.tile.pri{font-size:19px}
.tile svg{width:22px;height:22px}
.tile small{font-size:10px;font-weight:800;margin-left:1px}
.tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.tt{font-size:17px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.ts{font-size:14px;color:var(--ink-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts .red{color:var(--danger);font-weight:700}
.ta{font-size:13px;color:var(--ink-2);opacity:.8;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{flex:none;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:64px;border-left:1.5px solid var(--line);margin-block:14px;color:var(--ink-2);font-size:13px;font-weight:600;border-radius:0 22px 22px 0}
button.side:hover{color:var(--orange)}
.side .ic{width:22px;height:22px;border-radius:50%;background:var(--ink-2);color:var(--surface);display:grid;place-items:center}
button.side:hover .ic{background:var(--orange)}
.side .ic svg{width:13px;height:13px}
.item.done .tt,.item.completing .tt{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-3)}
.item.done .card{box-shadow:none;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.item.done .tile{filter:grayscale(.6);opacity:.7}
.item.completing .card{opacity:.5;transform:translateX(6px)}
.empty{background:var(--surface);border-radius:22px;padding:24px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:4px}
.more{align-self:center;font-weight:700;color:var(--ink-2);padding:10px 18px;border-radius:999px;background:var(--surface)}
.histday{font-size:18px;font-weight:800;margin-top:6px}
.histday span{font-size:14px;font-weight:600;color:var(--ink-3);margin-left:6px}

/* overview */
.ovgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ovtile{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.ovtile .num{font-size:30px;font-weight:800;letter-spacing:-.02em}
.ovtile .lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.ovsec{background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.ovsec h4{margin:0;font-size:15px;font-weight:800}
.ovrow{display:flex;align-items:center;gap:10px}
.ovrow .av{flex:none;width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--c);display:grid;place-items:center;font-size:12px;font-weight:800}
.ovrow .av svg{width:15px;height:15px}
.ovrow .nm{flex:none;width:74px;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovbar{flex:1;height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.ovbar > i{display:block;height:100%;border-radius:999px;background:var(--c)}
.ovrow .n{flex:none;width:24px;text-align:right;font-size:13px;font-weight:800;color:var(--ink-2)}
.ovtrend{display:flex;align-items:flex-end;gap:8px;height:112px}
.ovtrend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.ovtrend .colbar{width:100%;max-width:28px;border-radius:8px 8px 3px 3px;background:var(--orange)}
.ovtrend .v{font-size:12px;font-weight:800;color:var(--ink-2)}
.ovtrend .d{font-size:11px;font-weight:700;color:var(--ink-3)}
.back{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ink-2);height:40px;padding-right:12px}
.back svg{width:18px;height:18px}

/* quick add */
.qa{background:var(--peach);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:10px}
.qa form{display:flex;gap:10px}
.qa input{flex:1;min-width:0;height:58px;border-radius:20px;border:2px solid transparent;background:var(--surface);padding:0 18px;font-size:18px;font-weight:600;outline:none}
.qa input::placeholder{color:var(--ink-3)}
.qa input:focus{border-color:var(--orange)}
.qa .go{flex:none;width:58px;height:58px;border-radius:50%;background:var(--brown);color:#fff;display:grid;place-items:center}
.qa .go svg{width:26px;height:26px}
:root[data-theme="dark"] .qa .go{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qa .go{color:#1a120c}}
.qrow{display:flex;align-items:flex-start;gap:8px}
.qwrap{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px}
.qlabel{flex:none;width:58px;padding-top:13px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--peach-ink);opacity:.75}
.qa .opt{flex:none;height:40px;padding:0 14px}
.qa .opt .av{margin-left:-8px}
.opt svg{width:16px;height:16px}
.sums{display:flex;flex-direction:column;gap:6px}
.sumrow{display:flex;gap:6px}
.sumrow .sum{flex:1 1 0;min-width:0}
.sum{min-width:0;justify-content:center;height:46px;padding:0 8px;border-radius:999px;background:var(--surface);display:flex;align-items:center;gap:6px;font-weight:700;font-size:14.5px;max-width:100%;white-space:nowrap}
.sum > svg{width:17px;height:17px;flex:none;color:var(--ink-2)}
.sum .car{flex:none;width:14px;height:14px;opacity:.6;transition:transform .2s}
.sum[aria-expanded="true"]{background:var(--ink);color:var(--bg)}
.sum[aria-expanded="true"] > svg{color:var(--bg)}
.sum[aria-expanded="true"] .car{transform:rotate(180deg)}
.sum .stack{display:flex;flex:none}
.sum .stack i{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font:800 10px/24px var(--f);text-align:center;font-style:normal;box-shadow:0 0 0 2px var(--surface)}
.sum .stack i + i{margin-left:-7px}
.sum .lbl{overflow:hidden;text-overflow:ellipsis}
.qpanel{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 2px}
.opt.new{background:transparent;border:2px dashed color-mix(in srgb,var(--peach-ink) 35%,transparent);color:var(--peach-ink)}
.tile.multi{font-size:13px}
/* calendar */
.cal{background:var(--surface);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:6px;max-width:380px;width:100%;box-sizing:border-box}
.calhead{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:16px}
.calhead button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.calhead button:hover{background:var(--soft)}
.calhead svg{width:16px;height:16px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.calgrid .wd{font-size:12px;color:var(--ink-3);font-weight:800;padding:4px 0}
.calgrid button{aspect-ratio:1;border-radius:50%;font-weight:700;font-size:15px;max-height:46px}
.calgrid button:hover{background:var(--soft)}
.calgrid button.past{color:var(--ink-3)}
.calgrid button.now{box-shadow:inset 0 0 0 2px var(--ink)}
.calgrid button[aria-pressed="true"]{background:var(--orange);color:#fff;box-shadow:none}
/* overdue strip */
.over{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--danger) 13%,var(--surface));border-radius:20px;padding:10px 10px 10px 18px;font-weight:800;color:var(--danger)}
.over button{margin-left:auto;flex:none;height:44px;padding:0 18px;border-radius:999px;background:var(--danger);color:#fff;font-weight:800}
.prog{font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--ink-2)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(30,18,10,.4);display:flex;align-items:flex-end;justify-content:center;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
.sheet{width:100%;box-sizing:border-box;max-width:560px;max-height:calc(100vh - env(safe-area-inset-top,0px) - 8px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 8px);overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:30px 30px 0 0;padding:14px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
@media (max-width:699px){.sheet{box-shadow:0 120px 0 0 var(--bg)}}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:30px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.sheethead{display:flex;align-items:center;gap:10px}
.sheet h4{margin:0;font-size:24px;font-weight:800;flex:1;min-width:0}
.closex{flex:none;width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--ink-2);display:grid;place-items:center;box-shadow:var(--shadow)}
.closex:hover{color:var(--ink);background:var(--soft)}
.closex svg{width:18px;height:18px}
.field{display:flex;flex-direction:column;gap:8px}
.field > span{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.remtoggle{width:100%;display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:10px 12px;min-height:60px;font-weight:700;font-size:17px;text-align:left;color:var(--ink);box-sizing:border-box}
.remtoggle .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--ink-2);flex:none}
.remtoggle .ic svg{width:20px;height:20px}
.remtoggle .lbl{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.remtoggle .lbl small{font-size:13px;font-weight:600;color:var(--ink-2)}
.remtoggle[aria-pressed="true"] .ic{background:var(--rem);color:var(--rem-ink)}
.remtoggle[aria-pressed="true"] .lbl small{color:var(--rem)}
.switch{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.remtoggle[aria-pressed="true"] .switch{background:var(--rem)}
.remtoggle[aria-pressed="true"] .switch i{transform:translateX(20px)}
.remopts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opt.rq[aria-pressed="true"]{background:var(--rem);color:var(--rem-ink)}
.timepick{position:relative;overflow:hidden;cursor:pointer}
.timepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
.remhint{font-size:14px;font-weight:600;color:var(--ink-2);padding:8px 4px 0}
.remhint.bad{color:var(--danger)}
.item.rem .card{background:var(--rem-soft);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rem) 32%,transparent),var(--shadow)}
.rempill{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;margin-top:3px;padding:3px 10px 3px 7px;border-radius:999px;background:var(--rem);color:var(--rem-ink);font-size:13px;font-weight:800;white-space:nowrap}
.rempill svg{width:14px;height:14px}
.rempill.past{background:transparent;color:var(--rem);box-shadow:inset 0 0 0 1.5px var(--rem)}
.chip.remchip{color:var(--rem)}
.chip.remchip .av{background:var(--rem);color:var(--rem-ink)}
.remwarn{width:100%;text-align:left;background:var(--rem-soft);color:var(--rem);border-radius:16px;padding:12px 14px;font-weight:700;font-size:15px}
.field input[type=text],.field textarea{border:2px solid transparent;background:var(--surface);border-radius:18px;padding:14px 16px;font-size:18px;font-weight:600;outline:none;width:100%;box-sizing:border-box}
.field textarea{font-weight:500;font-size:16px;min-height:74px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--orange)}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:42px;padding:0 16px;border-radius:999px;background:var(--surface);font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap}
.opt .av{width:26px;height:26px;margin-left:-10px;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--c);font-size:11px;display:grid;place-items:center;font-weight:800}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.opt[aria-pressed="true"] .av{background:var(--c);color:#fff}
.datewrap{position:relative}
.datewrap input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.swatch{width:44px;height:44px;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:inset 0 0 0 3px var(--bg)}
.swatch[aria-pressed="true"]{border-color:var(--c)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:110px;height:56px;border-radius:999px;font-weight:800;font-size:16px;background:var(--surface)}
.btn.primary{background:var(--brown);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#1a120c}}
.btn.danger{color:var(--danger);flex:none;min-width:0;padding:0 20px}
.btn.danger.armed{background:var(--danger);color:#fff}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;height:46px;border-radius:999px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stamp{font-size:14px;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 10px 10px 18px;border-radius:18px;font-weight:700;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 40px)}
.toast button{background:rgba(127,127,127,.3);color:inherit;padding:8px 14px;border-radius:12px;font-weight:800}
.warn{background:#FFC857;color:#3a2410;font-weight:700;font-size:14px;padding:12px 16px;border-radius:18px}
.updbar{background:var(--orange);color:#fff;font-weight:700;font-size:14px;padding:12px 16px;border-radius:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.updbar button{background:#fff;color:var(--orange);border:none;border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px}
@media (max-width:380px){.top h1{font-size:28px}.banner .art{width:80px;height:80px}.side{width:62px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* login */
.loginwrap{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.logincard{width:100%;max-width:360px;background:var(--surface);border-radius:26px;padding:28px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.logincard h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.logincard .sub{color:var(--ink-2);font-size:14px;margin-top:-8px}
.logincard label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.logincard input{height:52px;border-radius:16px;border:2px solid var(--line);background:var(--soft);padding:0 16px;font-size:16px;font-weight:600;outline:none;color:var(--ink)}
.logincard input:focus{border-color:var(--orange)}
.logincard .btn{height:52px;border-radius:16px;background:var(--brown);color:#fff;font-weight:800;font-size:16px;display:grid;place-items:center;margin-top:4px}
:root[data-theme="dark"] .logincard .btn{color:#1a120c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logincard .btn{color:#1a120c}}
.logincard .err{color:var(--danger);font-size:13.5px;font-weight:700;min-height:1px}
.logincard .btn[disabled]{opacity:.6}
</style>
</head>
<body>

<div class="loginwrap" id="loginwrap" style="display:none">
  <form class="logincard" id="loginForm" autocomplete="on">
    <h1>Daybook</h1>
    <div class="sub">Sign in to see your team's tasks.</div>
    <label>Email<input type="email" id="loginEmail" autocomplete="username" required></label>
    <label>Password<input type="password" id="loginPass" autocomplete="current-password" required></label>
    <div class="err" id="loginErr"></div>
    <button class="btn" type="submit" id="loginBtn">Sign in</button>
  </form>
</div>

<div class="app" id="app" style="display:none">
  <div id="warn"></div>
  <div id="updbar"></div>
  <div id="top" style="display:flex;flex-direction:column;gap:22px"></div>
  <section class="qa" id="qa" aria-label="Quick add">
    <form id="qaForm" autocomplete="off"><input id="qaInput" type="text" placeholder="What needs doing?" enterkeyhint="done" aria-label="New task"><button class="go" type="submit" aria-label="Add task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></form>
    <div id="qaOpts" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>
  <div id="rest" style="display:flex;flex-direction:column;gap:22px"></div>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
const COLORS = ['#EF7B2D','#E4574C','#2FA66A','#3B82F6','#8B5CF6','#E0509A','#13A3B5','#C28A12'];
const I = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3.5 7a2 2 0 0 1 2-2H10l2 2.5h6.5a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  hist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 4v4h4"/><path d="M12 8v4.5l3 2"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 4h9l4 4v12H6z"/><path d="M9 12h6M9 16h4"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M6 3a1 1 0 0 1 1 1v.3c1.4-.6 3-.6 4.4 0 1.7.7 3.6.7 5.2-.1a1 1 0 0 1 1.4.9v8.1a1 1 0 0 1-.5.9c-2 1.1-4.3 1.1-6.3.1-1.4-.7-3-.7-4.4 0V21a1 1 0 1 1-2 0V4a1 1 0 0 1 1-1z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
  all:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>'
};

let db = null, synced = null;
let people = [], projects = [], tasks = [];
let sel = null;          // selected date
let filter = {personId:null, projectId:null};   // independent facets, either or both may be set
let mode = 'day';        // day | history
let histLimit = 60, showSomeday = false;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const today = () => ymd(new Date());
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const mondayOf = s => { const d = parse(s); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return ymd(d); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const initials = n => (n||'?').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
function dayLabel(s){
  if(!s) return 'Someday';
  const diff = Math.round((parse(s) - parse(today()))/864e5);
  if(diff===0) return 'Today'; if(diff===1) return 'Tomorrow'; if(diff===-1) return 'Yesterday';
  const d = parse(s);
  if(diff>1 && diff<7) return d.toLocaleDateString('en-AU',{weekday:'long'});
  return d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
}
const longDate = s => parse(s).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const timeOf = ms => new Date(ms).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'});
const hhmm = s => { if(!s) return ''; const [h,m] = s.split(':').map(Number); return new Date(2000,0,1,h,m).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}); };
const dateOfMs = ms => ymd(new Date(ms));
const ME_DEFAULT = {id:'me', name:'Me', color:'#EF7B2D', order:0, isMe:true};
const allPeople = () => { const p = [...people].sort((a,b)=>(b.isMe?1:0)-(a.isMe?1:0) || (a.order||0)-(b.order||0) || a.name.localeCompare(b.name)); return p.some(x=>x.id==='me') ? p : [ME_DEFAULT, ...p]; };
const allProjects = () => [...projects].sort((a,b)=>(a.order||0)-(b.order||0) || a.name.localeCompare(b.name));
const person = id => allPeople().find(p=>p.id===id) || ME_DEFAULT;
const project = id => projects.find(p=>p.id===id);
const byCreated = (a,b) => (a.date||'9999').localeCompare(b.date||'9999') || (a.createdAt||0)-(b.createdAt||0);
const pids = t => (Array.isArray(t.personIds) && t.personIds.length) ? t.personIds : [t.personId||'me'];
const prioRank = t => t.priority ? t.priority : Infinity;
const namesOf = ids => ids.map(i=>{ const p = person(i); return p.isMe?'Me':p.name; });
function passes(t){
  if(filter.personId && !pids(t).includes(filter.personId)) return false;
  if(filter.projectId && t.projectId!==filter.projectId) return false;
  return true;
}

/* ---------- writes (optimistic) ---------- */
function localApply(col, id, data){
  const arr = col==='tasks'?tasks:col==='people'?people:projects;
  const i = arr.findIndex(x=>x.id===id);
  if(data===null){ if(i>-1) arr.splice(i,1); }
  else if(i>-1) arr[i] = {id, ...data}; else arr.push({id, ...data});
}
async function put(col, id, data){
  localApply(col, id, data); render();
  if(!db) return;
  try{ await db.collection(col).doc(id).set(data); }
  catch(e){ toast(e && e.code==='quota_exceeded' ? 'Storage full — clear some old history' : 'Couldn’t save that change. Check your connection.'); }
}
async function del(col, id){
  localApply(col, id, null); render();
  if(!db) return;
  try{ await db.collection(col).doc(id).delete(); }catch(e){ toast('Couldn’t delete. Check your connection.'); }
}
const strip = o => { const c = {...o}; delete c.id; return c; };
const saveTask = t => put('tasks', t.id, strip(t));

function completeTask(id, el){
  const t = tasks.find(x=>x.id===id); if(!t) return;
  if(t.done){ saveTask({...t, done:false, doneAt:null}); return; }
  if(el) el.classList.add('completing');
  setTimeout(() => {
    saveTask({...t, done:true, doneAt:Date.now()});
    toast('Nice — done', 'Undo', () => { const c = tasks.find(x=>x.id===id); if(c) saveTask({...c, done:false, doneAt:null}); });
  }, el ? 380 : 0);
}
function pushTask(id){
  const t = tasks.find(x=>x.id===id); if(!t) return;
  const tm = addDays(today(),1);
  const next = (!t.date || t.date < tm) ? tm : addDays(t.date,1);
  saveTask({...t, date:next});
  toast('Moved to ' + dayLabel(next), 'Undo', () => { const c = tasks.find(x=>x.id===id); if(c) saveTask({...c, date:t.date}); });
}
function moveOverdue(){
  const t0 = today();
  tasks.filter(t=>!t.done && t.date && t.date<t0 && passes(t)).forEach(t=>saveTask({...t, date:t0}));
  toast('Moved into today');
}

/* ---------- render ---------- */
function greeting(){ const h = new Date().getHours(); return h<12?'Morning':h<17?'Afternoon':'Evening'; }
function openOn(d){ // open tasks shown on a date (today includes overdue)
  const t0 = today();
  return tasks.filter(t=>!t.done && passes(t) && (t.date===d || (d===t0 && t.date && t.date<t0)));
}
function renderWeek(){
  const t0 = today(), mon = mondayOf(sel);
  const names = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let days = '';
  for(let i=0;i<7;i++){
    const d = addDays(mon,i);
    const o = openOn(d); const hasOver = d===t0 && o.some(t=>t.date<t0);
    days += `<button class="day${d===t0?' today':''}" data-day="${d}" aria-pressed="${d===sel}" aria-label="${esc(longDate(d))}${o.length?`, ${o.length} tasks`:''}">
      <span class="dn">${names[i]}</span><span class="dc">${parse(d).getDate()}${o.length?`<span class="dot${hasOver?' red':''}"></span>`:''}</span></button>`;
  }
  const monthLbl = parse(mon).toLocaleDateString('en-AU',{month:'long',year:'numeric'});
  return `<section class="week"><div class="weekbar"><button class="arr" data-wk="-7" aria-label="Previous week">${I.left}</button><span>${esc(monthLbl)}</span><button class="arr" data-wk="7" aria-label="Next week">${I.right}</button>

    const j = sub.toJSON();
    const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(j.endpoint));
    const id = Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('').slice(0,32);
    const device = isIOS ? 'iPhone' : /Mac/.test(navigator.userAgent) ? 'Mac' : 'Other';
    const { error } = await sb.from('push_subs').upsert({ id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, tz: Intl.DateTimeFormat().resolvedOptions().timeZone, device, created_at: Date.now(), fails: 0 });
    if(error) throw error;
    toast('Reminders are on for this device');
  } catch(e){ console.error(e); toast('Couldn’t turn on notifications: ' + (e && e.message ? e.message : e)); }
}
async function testPush(){
  try {
    const { data } = await sb.auth.getSession();
    const r = await fetch(PUSH_FN, { method:'POST', headers:{ 'content-type':'application/json', authorization:'Bearer ' + (data.session ? data.session.access_token : '') }, body: JSON.stringify({ action:'test' }) }).then(r => r.json());
    toast(r.ok ? `Test sent to ${r.ok} device${r.ok>1?'s':''}` : (r.error || 'No devices have notifications on yet'));
  } catch(e){ toast('Test failed'); }
}
function makeDb(sb){
  const OUT = {
    tasks: r => ({id:r.id, title:r.title, note:r.note||'', personId:r.person_id, personIds:r.person_ids||[], projectId:r.project_id, priority:r.priority, date:r.date, done:!!r.done, doneAt:r.done_at, createdAt:r.created_at, time:r.time||null, remindAt:r.remind_at||null, remindedAt:r.reminded_at||null}),
    people: r => ({id:r.id, name:r.name, color:r.color, order:r.order||0, isMe:!!r.is_me}),
    projects: r => ({id:r.id, name:r.name, color:r.color, order:r.order||0})
  };
  const IN = {
    tasks: d => ({title:d.title, note:d.note||'', person_id:d.personId||null, person_ids:d.personIds||[], project_id:d.projectId||null, priority:d.priority||null, date:d.date||null, done:!!d.done, done_at:d.doneAt||null, created_at:d.createdAt||Date.now(), ...remindCols(d)}),
    people: d => ({name:d.name, color:d.color, order:d.order||0, is_me:!!d.isMe}),
    projects: d => ({name:d.name, color:d.color, order:d.order||0}),
    settings: d => ({name:d.name||null})
  };
  const channels = [];
  return {
    collection(col){
      return {
        doc(id){
          return {
            async set(data){ const {error} = await sb.from(col).upsert({id, ...IN[col](data)}); if(error) throw error; },
            async delete(){ const {error} = await sb.from(col).delete().eq('id', id); if(error) throw error; }
          };
        },
        onSnapshot(onNext, onErr){
          const load = async () => {
            const {data, error} = await sb.from(col).select('*');
            if(error){ onErr && onErr(error); return; }
            onNext({docs: data.map(r => ({id:r.id, data:()=>OUT[col](r)}))});
          };
          load();
          const ch = sb.channel('rt-'+col).on('postgres_changes', {event:'*', schema:'public', table:col}, load).subscribe();
          channels.push(ch);
        }
      };
    },
    doc(path){
      const [col, id] = path.split('/');
      return {
        async set(data){ const {error} = await sb.from(col).upsert({id, ...IN[col](data)}); if(error) throw error; },
        onSnapshot(onNext, onErr){
          const load = async () => {
            const {data, error} = await sb.from(col).select('*').eq('id', id).maybeSingle();
            if(error){ onErr && onErr(error); return; }
            onNext({exists: !!data, data:()=>data?{name:data.name}:null});
          };
          load();
          const ch = sb.channel('rt-'+col+'-'+id).on('postgres_changes', {event:'*', schema:'public', table:col, filter:`id=eq.${id}`}, load).subscribe();
          channels.push(ch);
        }
      };
    },
    teardown(){ channels.forEach(c => sb.removeChannel(c)); channels.length = 0; }
  };
}

function startSync(){
  db = makeDb(sb); synced = true;
  const sub = (col, set) => db.collection(col).onSnapshot(s => { set(s.docs.map(d=>({id:d.id, ...d.data()}))); render(); },
    () => { synced = false; render(); });
  db.doc('settings/app').onSnapshot(d => { if(d.exists){ settings = {...settings, ...d.data()}; render(); } }, ()=>{});
  sub('people', v=>people=v); sub('projects', v=>projects=v); sub('tasks', v=>tasks=v);
}
function stopSync(){ if(db && db.teardown) db.teardown(); db = null; synced = null; }

function showApp(){
  $('#loginwrap').style.display = 'none';
  $('#app').style.display = 'flex';
  startSync();
}
function showLogin(err){
  stopSync();
  $('#app').style.display = 'none';
  $('#loginwrap').style.display = 'flex';
  if(err) $('#loginErr').textContent = err;
}

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#loginEmail').value.trim(), password = $('#loginPass').value;
  $('#loginErr').textContent = '';
  $('#loginBtn').disabled = true; $('#loginBtn').textContent = 'Signing in…';
  const {error} = await sb.auth.signInWithPassword({email, password});
  $('#loginBtn').disabled = false; $('#loginBtn').textContent = 'Sign in';
  if(error) $('#loginErr').textContent = error.message === 'Invalid login credentials' ? 'Wrong email or password.' : error.message;
});

sb.auth.onAuthStateChange((event, session) => {
  if(session) showApp(); else showLogin();
});
sb.auth.getSession().then(({data}) => { if(data.session) showApp(); else showLogin(); });

let swReg = null;
function renderUpdateBanner(show){
  $('#updbar').innerHTML = show ? `<div class="updbar"><span>A new version of Daybook is ready.</span><button type="button" id="updApply">Refresh</button></div>` : '';
  if(show){ const b = $('#updApply'); if(b) b.onclick = applyUpdate; }
}
function applyUpdate(){ if(swReg && swReg.waiting){ swReg.waiting.postMessage('skipWaiting'); } }
async function checkForUpdate(manual){
  if(!swReg) return;
  try{ await swReg.update(); }catch(_){}
  setTimeout(() => {
    if(swReg.waiting){ renderUpdateBanner(true); if(manual) toast('Update found — tap Refresh above.'); }
    else if(manual){ toast('You’re on the latest version.'); }
  }, 800);
}
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      swReg = reg;
      if(reg.waiting && reg.active) renderUpdateBanner(true);
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing; if(!nw) return;
        nw.addEventListener('statechange', () => {
          if(nw.state === 'installed' && navigator.serviceWorker.controller) renderUpdateBanner(true);
        });
      });
    }).catch(()=>{});
  });
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(reloaded) return; reloaded = true; window.location.reload();
  });
  document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') checkForUpdate(false); });
}
})();
</script>
